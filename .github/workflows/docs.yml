name: Documentation checks

# This repository is documentation, so Markdown defects are production defects.
# The checks in scripts/check-docs.mjs each exist because the defect they look
# for reached the default branch and was found by eye.
on:
  pull_request:
    paths:
      - '**/*.md'
      # Every script and workflow, not only the checks' own files: check 7 in
      # check-docs.mjs reads every tracked file for a restated gitleaks pin,
      # and the likeliest place for one is a script or a workflow.
      - 'scripts/**'
      - '.github/workflows/**'
      - 'templates/.claude/**'
      # check-template-kit.mjs walks EVERY .claude/settings.json in the tree,
      # this repository's own included. Filtering on templates/ alone meant a
      # break in .claude/settings.json ran neither job.
      - '.claude/**'
  push:
    branches: [main]
    paths:
      - '**/*.md'
      # Every script and workflow, not only the checks' own files: check 7 in
      # check-docs.mjs reads every tracked file for a restated gitleaks pin,
      # and the likeliest place for one is a script or a workflow.
      - 'scripts/**'
      - '.github/workflows/**'
      - 'templates/.claude/**'
      # check-template-kit.mjs walks EVERY .claude/settings.json in the tree,
      # this repository's own included. Filtering on templates/ alone meant a
      # break in .claude/settings.json ran neither job.
      - '.claude/**'
  workflow_dispatch:

# Least privilege, stated rather than inherited. Both jobs run code out of the
# checkout -- check-docs installs from a PR-authored package-lock.json, and
# check-template-kit runs the kit's own hook commands (check 9) -- so neither
# job may ever be given something worth stealing. A fork's pull_request run is
# already read-only and secret-free; this makes that unconditional for same-repo
# runs too, and makes the constraint visible to whoever edits this file next.
permissions:
  contents: read

jobs:
  check-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # npm ci, not npm install: the mermaid pin is load-bearing, since the
      # point of the check is to reproduce the parser that rejects a diagram.
      # Pinning it in package.json alone would still let the transitive tree
      # resolve fresh on every run, so scripts/package-lock.json is committed
      # (with a .gitignore exception) and installed from.
      - name: Install check dependencies
        working-directory: scripts
        run: npm ci --no-audit --no-fund

      - name: Check documentation
        run: node scripts/check-docs.mjs

  # NEVER move this job to pull_request_target, give it secrets, or grant it a
  # write token: check 9 in check-template-kit.mjs executes the hook commands
  # declared in the checked-out settings.json. That is safe only because a
  # pull_request run has nothing worth taking.
  # The starter kit in templates/.claude/ is copied into adopters' projects, so
  # a structural defect in it ships to every one of them. Both hook entries in
  # that file were malformed from the day it shipped and nothing noticed.
  # A separate job, not a step, so the check-docs job keeps its name for any
  # branch protection that references it. No dependencies, so no npm ci.
  check-template-kit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check template kit
        run: node scripts/check-template-kit.mjs

  # NEVER move this job to pull_request_target, give it secrets, or grant it a
  # write token: it runs a script the pull request can edit, which is safe only
  # because a pull_request run has nothing worth taking.
  # Holds the Secrets rule in code/python-standards.md: its secret-refs.env
  # example must contain references and nothing else, and share no key with its
  # example.env example. Preventive rather than prompted by a shipped defect.
  # A separate job for the same reasons as check-template-kit. Python's standard
  # library only: adopting projects run this same script, and a Python project
  # should not need Node to run it.
  check-secret-refs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The script's stated floor, so a newer-only construct fails here rather
      # than in an adopting project on an older interpreter.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Check secret reference examples
        run: python scripts/check_secret_refs.py --standard

      # File mode is the path adopting projects use, and --standard never runs
      # it. `if` rather than `! cmd`: bash -e ignores a failure under `!`, so a
      # check that wrongly passed would not fail the step.
      - name: Check file mode
        run: |
          d="$RUNNER_TEMP/refs"; mkdir -p "$d"
          printf 'A=op://dev/a/b\r\n' > "$d/ok.env"
          printf 'C=1\n' > "$d/example.env"
          printf 'A=hunter2\n' > "$d/bad.env"
          python scripts/check_secret_refs.py "$d/ok.env" --config "$d/example.env"
          for f in bad.env missing.env; do
            if python scripts/check_secret_refs.py "$d/$f" --config "$d/example.env"; then
              echo "check_secret_refs.py passed $f, which it must reject" >&2
              exit 1
            fi
          done
