name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # Full history, so a review can diff earlier commits of a PR

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Read-only GitHub MCP tools, so a review can read the issues, PRs
          # and comments a PR cites. Naming any mcp__github__ tool makes the
          # action start the GitHub MCP server; tools not listed are denied.
          # Keep the list to exact read tools. Not gh commands: a Bash prefix
          # rule approves any flag after it, and gh's --jq can print
          # environment variables, secrets included. See PR #65.
          #
          # The list narrows what a review runs, not what its token can do.
          # The server uses the Claude GitHub App's token, which can write
          # code, issues and PRs in this repo. The real boundaries are the
          # action's own:
          #   - only a user with write access to this repo can start a run;
          #   - the token can write only to this repo (the action's
          #     docs/security.md). It may still read public repos elsewhere.
          claude_args: |
            --allowedTools "mcp__github__get_issue,mcp__github__get_issue_comments,mcp__github__get_pull_request,mcp__github__get_pull_request_diff,mcp__github__get_pull_request_files,mcp__github__get_pull_request_reviews,mcp__github__get_pull_request_review_comments"
