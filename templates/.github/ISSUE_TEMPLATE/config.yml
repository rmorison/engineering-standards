# Issue template chooser. For a public repository with a SECURITY.md, the
# contact link below is required: it sends a reporter to the private
# vulnerability report instead of a public issue. For a private repository,
# point it at the internal channel in SECURITY.md, or delete it.
# https://github.com/rmorison/engineering-standards/blob/main/process/repository-standards.md#issue-and-pull-request-templates
blank_issues_enabled: true
contact_links:
  - name: Report a security vulnerability
    url: https://github.com/<owner>/<repository>/security/advisories/new
    about: Report security problems privately, not in a public issue. See SECURITY.md.
